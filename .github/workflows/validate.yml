name: Validate Lab Repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse failure: $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Reject committed local secret files
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = $tracked | Where-Object {
            $_ -match '(^|/)(\.env|credentials/|secrets/\.env)' -and $_ -notmatch '\.env\.example$'
          }
          if ($bad) {
            Write-Error "Potential local secret files are tracked:`n$($bad -join "`n")"
            exit 1
          }
